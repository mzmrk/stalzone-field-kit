name: Synchronize prices

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize canonical price index
        run: npm run pricing:sync

      - name: Verify synchronized application
        run: npm test && npm run build

      - name: Commit refreshed prices
        run: |
          if git diff --quiet -- src/generated/pricing-index.json; then
            echo "Bundled prices are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/pricing-index.json
          git commit -m "pricing: synchronize canonical estimates (bundle market-history index)"
          git push origin HEAD:main
